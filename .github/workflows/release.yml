name: release

# Creates the git tag + GitHub Release from notes in .github/release-notes/.
# The macOS app zip cannot be built here (Native SDK is a local framework),
# so build it with scripts/package.sh and attach it to the release:
#   gh release upload <tag> dist/Goban-macOS-arm64.zip
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.18.0); notes file must exist"
        required: true

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: unit tests
        run: node scripts/test-game.mjs
      - name: version guard — app.zon must match the tag
        env:
          TAG: ${{ inputs.tag }}
        # v1.25.0 shipped an installer stamped 1.24.0 because app.zon was not
        # bumped; fail the release up front instead of shipping the mismatch.
        run: |
          want="${TAG#v}"
          have="$(sed -n 's/^ *\.version = "\(.*\)",$/\1/p' app.zon)"
          if [ "$have" != "$want" ]; then
            echo "app.zon .version is '$have' but tag wants '$want' — bump app.zon first"
            exit 1
          fi
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          notes=".github/release-notes/${TAG}.md"
          test -f "$notes" || { echo "missing $notes"; exit 1; }
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$notes"
      - name: chain platform builds + asset upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        # Prefer the original workflow_dispatch chain (human / tokens with
        # actions:write). If that fails (typical agent token → 403), fall back
        # to repository_dispatch; build-macos/windows listen for build-release.
        run: |
          if gh workflow run build-macos.yml --ref "$GITHUB_REF_NAME" -f release_tag="$TAG" \
            && gh workflow run build-windows.yml --ref "$GITHUB_REF_NAME" -f release_tag="$TAG"; then
            echo "Chained builds via workflow_dispatch"
          else
            echo "workflow_dispatch failed; falling back to repository_dispatch"
            gh api -X POST "repos/${{ github.repository }}/dispatches" \
              -f event_type=build-release \
              -f "client_payload[tag]=$TAG"
          fi
