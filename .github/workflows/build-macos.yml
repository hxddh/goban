name: build-macos

# Builds Goban.app (arm64, adhoc-signed) on a macOS runner: Native SDK comes
# from npm (@native-sdk/cli), zig from ziglang.org. Optionally uploads the
# zip to an existing release when release_tag is set.
#
# Triggers:
#   - workflow_dispatch (manual / release.yml chain)
#   - repository_dispatch type=build-release (agent / API; client_payload.tag)
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to upload the zip to (optional)"
        required: false
        default: ""
  repository_dispatch:
    types: [build-release]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: resolve release tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.client_payload.tag }}"
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: '${TAG:-<none>}'"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: unit tests
        run: node scripts/test-game.mjs
      - name: install Native SDK CLI
        run: |
          npm install -g @native-sdk/cli
          native --version || true
          echo "SDK_PATH=$(npm root -g)/@native-sdk/cli" >> "$GITHUB_ENV"
      # SDK 只交 appkit_host.m,不交它自己的链接需求 —— 那份 linkFramework 清单在
      # build.zig 里由我们维护。0.8.4 加了 ScreenCaptureKit,我们没跟上,结果是
      # zig build 里 10 个未定义符号。这一步把同一类失败提前到编译前,并且说人话。
      # (只看 #import,抓不到传递性符号依赖 —— 那一半仍然靠下面的真构建。)
      - name: framework guard — build.zig must link what appkit_host.m imports
        run: node scripts/check-frameworks.mjs
      # version 省略 —— setup-zig 读 build.zig.zon 的 minimum_zig_version
      - uses: mlugg/setup-zig@v2
      - name: sync frontend dist
        run: |
          rm -rf frontend/dist && mkdir -p frontend/dist/js
          cp src/web/index.html src/web/styles.css frontend/dist/
          cp src/web/js/*.js frontend/dist/js/
          node scripts/gen-worker-src.mjs frontend/dist/js
          node scripts/build-info.mjs
      # 内置自动更新(Native SDK 0.10+,仅 macOS 系统宿主)。仓库配了公钥变量才打开:
      # 没配时构建照旧,也就不会出现一个查不到更新源的「检查更新」。
      # 配置:本机 `native update keygen` → 打印的公钥进仓库变量 NATIVE_UPDATE_PUBLIC_KEY,
      #       `base64 < native-update.key` 进仓库 Secret NATIVE_UPDATE_KEY。私钥只在 Secret 里。
      - name: enable auto-update (when configured)
        if: ${{ vars.NATIVE_UPDATE_PUBLIC_KEY != '' }}
        run: node scripts/enable-updates.mjs "${{ vars.NATIVE_UPDATE_PUBLIC_KEY }}"
      - name: zig build
        run: zig build -Doptimize=ReleaseFast -Dnative-sdk-path="$SDK_PATH"
      - name: package .app + zip
        run: |
          mkdir -p dist
          native package --target macos --signing adhoc --output dist/Goban.app --binary zig-out/bin/goban
          ditto -c -k --sequesterRsrc --keepParent dist/Goban.app dist/Goban-macOS-arm64.zip
          ls -lh dist
      - uses: actions/upload-artifact@v7
        with:
          name: Goban-macOS-arm64
          path: dist/Goban-macOS-arm64.zip
      - name: upload to release
        if: ${{ steps.tag.outputs.value != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.value }}
        run: gh release upload "$TAG" dist/Goban-macOS-arm64.zip --clobber
      # 更新源:用私钥签一份 update-macos.json(版本、压缩包地址、SHA-256),挂在这一版的
      # 附件里;应用读的是 releases/latest/download/update-macos.json。更新包就是上面那个
      # zip —— 里面正好一个 Goban.app,SDK 的校验要的就是这个形状。签名失败只警告:这一版
      # 照样发布,只是不通过自动更新推送。
      - name: sign + publish update feed (when configured)
        if: ${{ steps.tag.outputs.value != '' && vars.NATIVE_UPDATE_PUBLIC_KEY != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.value }}
          UPDATE_KEY: ${{ secrets.NATIVE_UPDATE_KEY }}
        run: |
          if [ -z "$UPDATE_KEY" ]; then
            echo "::warning::有公钥变量但没有 NATIVE_UPDATE_KEY Secret,这一版不发布更新源"
            exit 0
          fi
          key="$RUNNER_TEMP/native-update.key"
          printf '%s' "$UPDATE_KEY" | base64 --decode > "$key"
          chmod 600 "$key"
          notes="$(sed -n '1s/^## *//p' ".github/release-notes/$TAG.md" 2>/dev/null || true)"
          if native update sign --private-key "$key" --manifest app.zon \
               --archive dist/Goban-macOS-arm64.zip \
               --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/Goban-macOS-arm64.zip" \
               --target macos-aarch64 --notes "$notes" --output dist/update-macos.json; then
            gh release upload "$TAG" dist/update-macos.json --clobber
          else
            echo "::warning::更新源签名失败,这一版不通过自动更新推送(手动下载不受影响)"
          fi
          rm -f "$key"
