name: build-macos

# Builds Goban.app (arm64, adhoc-signed) on a macOS runner: Native SDK comes
# from npm (@native-sdk/cli), zig from ziglang.org. Optionally uploads the
# zip to an existing release when release_tag is set.
#
# Triggers:
#   - workflow_dispatch (manual / release.yml chain)
#   - repository_dispatch type=build-release (agent / API; client_payload.tag)
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to upload the zip to (optional)"
        required: false
        default: ""
  repository_dispatch:
    types: [build-release]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: resolve release tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.client_payload.tag }}"
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: '${TAG:-<none>}'"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: unit tests
        run: node scripts/test-game.mjs
      - name: install Native SDK CLI
        run: |
          npm install -g @native-sdk/cli
          native --version || true
          echo "SDK_PATH=$(npm root -g)/@native-sdk/cli" >> "$GITHUB_ENV"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: sync frontend dist
        run: |
          rm -rf frontend/dist && mkdir -p frontend/dist/js
          cp src/web/index.html src/web/styles.css frontend/dist/
          cp src/web/js/*.js frontend/dist/js/
          node scripts/gen-worker-src.mjs frontend/dist/js
          node scripts/build-info.mjs
      - name: zig build
        run: zig build -Doptimize=ReleaseFast -Dnative-sdk-path="$SDK_PATH"
      - name: package .app + zip
        run: |
          mkdir -p dist
          native package --target macos --signing adhoc --output dist/Goban.app --binary zig-out/bin/goban
          ditto -c -k --sequesterRsrc --keepParent dist/Goban.app dist/Goban-macOS-arm64.zip
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: Goban-macOS-arm64
          path: dist/Goban-macOS-arm64.zip
      - name: upload to release
        if: ${{ steps.tag.outputs.value != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.value }}
        run: gh release upload "$TAG" dist/Goban-macOS-arm64.zip --clobber
