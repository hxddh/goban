<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>五子棋</title>
  <style>
    :root {
      --bg: #14100e;
      --panel: #241c18;
      --panel-border: #3a2f28;
      --text: #f3e9dc;
      --muted: #b8a48c;
      --accent: #e8c39e;
      --btn: #3d322a;
      --btn-hover: #4a3d33;
      --win: #ffe08a;
      --side-w: 260px;
      --chrome-h: 48px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
        system-ui, -apple-system, sans-serif;
      user-select: none;
      overflow: hidden;
    }

    /* Immersive: board owns the window; chrome floats on top */
    #app {
      position: relative;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    .chrome {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: var(--chrome-h);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px 0 14px;
      background: linear-gradient(180deg, rgba(20,16,14,.92), rgba(20,16,14,.55) 70%, transparent);
      pointer-events: none;
    }
    .chrome > * { pointer-events: auto; }

    .brand {
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.04em;
    }
    .status-pill {
      font-size: 13px;
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,.28);
    }
    .status-pill.win { color: var(--win); }
    .spacer { flex: 1; }

    .icon-btn, .tool-btn {
      appearance: none;
      border: 0;
      border-radius: 9px;
      background: rgba(61,50,42,.9);
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }
    .icon-btn {
      width: 34px; height: 34px;
      display: grid; place-items: center;
      font-size: 16px;
      line-height: 1;
    }
    .tool-btn {
      height: 34px;
      padding: 0 12px;
      font-size: 13px;
    }
    .icon-btn:hover, .tool-btn:hover { background: var(--btn-hover); }
    .tool-btn.primary {
      background: linear-gradient(180deg, #f0d2a8, #d4a574);
      color: #2a1c10;
      font-weight: 600;
    }
    .tool-btn:disabled, .icon-btn:disabled { opacity: .4; cursor: default; }

    /* Board stage fills everything under chrome */
    .stage {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: calc(var(--chrome-h) + 8px) 12px 16px;
      transition: padding-right .25s ease;
    }
    #app.panel-open .stage {
      padding-right: calc(var(--side-w) + 20px);
    }

    #board-wrap {
      width: min(
        calc(100vw - 24px),
        calc(100vh - var(--chrome-h) - 28px),
        920px
      );
      height: min(
        calc(100vw - 24px),
        calc(100vh - var(--chrome-h) - 28px),
        920px
      );
      max-width: 100%;
      max-height: 100%;
      padding: clamp(10px, 2.2vmin, 22px);
      border-radius: 16px;
      background: linear-gradient(145deg, #e0b07a, #c9965c 45%, #b8864e);
      box-shadow:
        0 16px 50px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,255,255,.22);
      transition: width .25s ease, height .25s ease;
    }
    #app.panel-open #board-wrap {
      width: min(
        calc(100vw - var(--side-w) - 40px),
        calc(100vh - var(--chrome-h) - 28px),
        920px
      );
      height: min(
        calc(100vw - var(--side-w) - 40px),
        calc(100vh - var(--chrome-h) - 28px),
        920px
      );
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
      border-radius: 4px;
    }

    /* Sliding side panel */
    .side {
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: var(--side-w);
      z-index: 30;
      background: rgba(36, 28, 24, .96);
      border-left: 1px solid var(--panel-border);
      backdrop-filter: blur(12px);
      padding: calc(var(--chrome-h) + 8px) 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transform: translateX(100%);
      transition: transform .25s ease;
      box-shadow: -12px 0 40px rgba(0,0,0,.35);
    }
    #app.panel-open .side { transform: translateX(0); }

    .side h2 {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.06em;
    }
    .card {
      background: #342920;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .row { display: flex; align-items: center; gap: 10px; }
    .stone {
      width: 18px; height: 18px; border-radius: 50%;
      box-shadow: 0 1px 3px rgba(0,0,0,.4);
      flex-shrink: 0;
    }
    .stone.black {
      background: radial-gradient(circle at 35% 30%, #555, #111 60%, #000);
    }
    .stone.white {
      background: radial-gradient(circle at 35% 30%, #fff, #ddd 55%, #bbb);
    }
    .grow { flex: 1; }
    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent);
      color: #2a1c10;
      font-weight: 600;
    }
    .muted { color: var(--muted); font-size: 12px; }
    .btns { display: flex; flex-direction: column; gap: 8px; }
    .side button.block {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
      font-size: 14px;
      background: var(--btn);
      color: var(--text);
      cursor: pointer;
      text-align: left;
      width: 100%;
    }
    .side button.block:hover { background: var(--btn-hover); }
    .side button.block.active {
      outline: 2px solid var(--accent);
    }
    .side button.block.primary {
      background: linear-gradient(180deg, #f0d2a8, #d4a574);
      color: #2a1c10;
      font-weight: 600;
    }
    .footer {
      margin-top: auto;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
    }

    /* Dim board slightly when panel open on narrow screens */
    .scrim {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 25;
      background: rgba(0,0,0,.35);
    }
    #app.panel-open.scrim-on .scrim { display: block; }

    @media (max-width: 820px) {
      #app.panel-open .stage { padding-right: 12px; }
      #app.panel-open #board-wrap {
        width: min(calc(100vw - 24px), calc(100vh - var(--chrome-h) - 28px), 920px);
        height: min(calc(100vw - 24px), calc(100vh - var(--chrome-h) - 28px), 920px);
      }
    }
  </style>
</head>
<body>
  <div id="app" class="panel-open">
    <header class="chrome">
      <span class="brand">五子棋</span>
      <span class="status-pill" id="status">黑棋落子</span>
      <span class="muted" id="moves" style="font-size:12px">第 0 手</span>
      <span class="spacer"></span>
      <button type="button" class="tool-btn" id="undo" disabled title="悔棋 (Z)">悔棋</button>
      <button type="button" class="tool-btn primary" id="reset" title="新局 (N)">新局</button>
      <button type="button" class="icon-btn" id="toggle-panel" title="收起/展开侧栏 (Tab)" aria-label="切换侧栏">☰</button>
    </header>

    <div class="scrim" id="scrim"></div>

    <div class="stage">
      <div id="board-wrap">
        <canvas id="board" width="900" height="900" aria-label="棋盘"></canvas>
      </div>
    </div>

    <aside class="side" id="side" aria-label="对局面板">
      <h2>对局</h2>
      <div class="card">
        <div class="row">
          <span class="stone black"></span>
          <span class="grow">黑棋</span>
          <span class="badge" id="black-turn" hidden>行棋</span>
        </div>
        <div class="muted" id="black-role">你</div>
      </div>
      <div class="card">
        <div class="row">
          <span class="stone white"></span>
          <span class="grow">白棋</span>
          <span class="badge" id="white-turn" hidden>行棋</span>
        </div>
        <div class="muted" id="white-role">电脑</div>
      </div>

      <h2>模式</h2>
      <div class="btns">
        <button type="button" class="block active" id="mode-ai">人机对战</button>
        <button type="button" class="block" id="mode-pvp">双人对战</button>
      </div>

      <h2>操作</h2>
      <div class="btns">
        <button type="button" class="block" id="undo2" disabled>悔棋</button>
        <button type="button" class="block primary" id="reset2">新局</button>
        <button type="button" class="block" id="collapse">收起侧栏 · 沉浸</button>
      </div>

      <div class="footer">
        <strong>沉浸</strong>：点 ☰ 或 Tab 收起侧栏，棋盘占满窗口。<br />
        Z 悔棋 · N 新局 · 1 双人 · 2 人机<br />
        点交叉点落子 · 五子连珠胜
      </div>
    </aside>
  </div>
  <script>
(function () {
  const SIZE = 15;
  const WIN = 5;
  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const appEl = document.getElementById("app");

  /** @type {(''| 'b' | 'w')[][]} */
  let board = emptyBoard();
  /** @type {'b' | 'w'} */
  let turn = "b";
  /** @type {'play' | 'b' | 'w' | 'draw'} */
  let result = "play";
  /** @type {'ai' | 'pvp'} */
  let mode = "ai";
  /** @type {{r:number,c:number}[]} */
  let history = [];
  /** @type {{r:number,c:number}[] | null} */
  let winLine = null;

  const STARS = [
    [3, 3], [3, 7], [3, 11],
    [7, 3], [7, 7], [7, 11],
    [11, 3], [11, 7], [11, 11],
  ];

  function emptyBoard() {
    const b = [];
    for (let r = 0; r < SIZE; r++) {
      const row = [];
      for (let c = 0; c < SIZE; c++) row.push("");
      b.push(row);
    }
    return b;
  }

  function opp(t) { return t === "b" ? "w" : "b"; }

  function setPanelOpen(open) {
    appEl.classList.toggle("panel-open", open);
    // On narrow screens, show scrim when panel open
    appEl.classList.toggle("scrim-on", open && window.innerWidth < 900);
    localStorage.setItem("goban.panelOpen", open ? "1" : "0");
    // reflow board size after transition
    requestAnimationFrame(() => {
      resizeCanvas();
      draw();
    });
    setTimeout(() => { resizeCanvas(); draw(); }, 280);
  }

  function togglePanel() {
    setPanelOpen(!appEl.classList.contains("panel-open"));
  }

  function geometry() {
    const w = canvas.width;
    const pad = w * 0.065;
    const span = w - pad * 2;
    const step = span / (SIZE - 1);
    return { pad, step, w };
  }

  function resizeCanvas() {
    const wrap = document.getElementById("board-wrap");
    const rect = wrap.getBoundingClientRect();
    // Internal resolution follows CSS box for crisp stones
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const css = Math.max(200, Math.floor(Math.min(rect.width, rect.height)));
    const px = Math.floor(css * dpr);
    if (canvas.width !== px) {
      canvas.width = px;
      canvas.height = px;
    }
  }

  function cellAt(x, y) {
    const { pad, step } = geometry();
    const c = Math.round((x - pad) / step);
    const r = Math.round((y - pad) / step);
    if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) return null;
    const px = pad + c * step;
    const py = pad + r * step;
    const dist = Math.hypot(x - px, y - py);
    if (dist > step * 0.45) return null;
    return { r, c };
  }

  function draw() {
    const { pad, step, w } = geometry();
    ctx.clearRect(0, 0, w, w);

    const g = ctx.createLinearGradient(0, 0, w, w);
    g.addColorStop(0, "#e8c49a");
    g.addColorStop(0.5, "#d4a574");
    g.addColorStop(1, "#c28b52");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, w);

    ctx.save();
    ctx.globalAlpha = 0.04;
    for (let i = 0; i < 48; i++) {
      ctx.strokeStyle = i % 2 ? "#000" : "#fff";
      ctx.beginPath();
      ctx.moveTo(0, (i / 48) * w);
      ctx.lineTo(w, (i / 48) * w + 10);
      ctx.stroke();
    }
    ctx.restore();

    ctx.strokeStyle = "#3d2914";
    ctx.lineWidth = Math.max(1, w / 500);
    ctx.lineCap = "square";
    for (let i = 0; i < SIZE; i++) {
      const p = pad + i * step;
      ctx.beginPath();
      ctx.moveTo(pad, p);
      ctx.lineTo(pad + step * (SIZE - 1), p);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(p, pad);
      ctx.lineTo(p, pad + step * (SIZE - 1));
      ctx.stroke();
    }

    ctx.lineWidth = Math.max(2, w / 280);
    ctx.strokeRect(pad - 1, pad - 1, step * (SIZE - 1) + 2, step * (SIZE - 1) + 2);

    ctx.fillStyle = "#3d2914";
    for (const [r, c] of STARS) {
      const x = pad + c * step;
      const y = pad + r * step;
      ctx.beginPath();
      ctx.arc(x, y, Math.max(2.5, step * 0.09), 0, Math.PI * 2);
      ctx.fill();
    }

    const radius = step * 0.43;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const s = board[r][c];
        if (!s) continue;
        const x = pad + c * step;
        const y = pad + r * step;
        ctx.beginPath();
        ctx.arc(x + 1.5, y + 2, radius, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(0,0,0,0.25)";
        ctx.fill();
        const sg = ctx.createRadialGradient(
          x - radius * 0.35, y - radius * 0.4, radius * 0.1, x, y, radius
        );
        if (s === "b") {
          sg.addColorStop(0, "#666");
          sg.addColorStop(0.45, "#222");
          sg.addColorStop(1, "#000");
        } else {
          sg.addColorStop(0, "#fff");
          sg.addColorStop(0.55, "#eee");
          sg.addColorStop(1, "#c8c8c8");
        }
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fillStyle = sg;
        ctx.fill();
        if (s === "w") {
          ctx.strokeStyle = "rgba(0,0,0,0.2)";
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }

    if (history.length) {
      const last = history[history.length - 1];
      const x = pad + last.c * step;
      const y = pad + last.r * step;
      ctx.beginPath();
      ctx.arc(x, y, Math.max(2.5, step * 0.11), 0, Math.PI * 2);
      ctx.fillStyle = board[last.r][last.c] === "b" ? "#f5d76e" : "#c0392b";
      ctx.fill();
    }

    if (winLine && winLine.length) {
      ctx.strokeStyle = "rgba(220, 40, 40, 0.88)";
      ctx.lineWidth = Math.max(3, step * 0.13);
      ctx.lineCap = "round";
      ctx.beginPath();
      for (let i = 0; i < winLine.length; i++) {
        const p = winLine[i];
        const x = pad + p.c * step;
        const y = pad + p.r * step;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }

  function countDir(r, c, dr, dc, color) {
    let n = 0;
    let rr = r + dr, cc = c + dc;
    while (rr >= 0 && rr < SIZE && cc >= 0 && cc < SIZE && board[rr][cc] === color) {
      n++; rr += dr; cc += dc;
    }
    return n;
  }

  function findWin(r, c, color) {
    const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
    for (const [dr, dc] of dirs) {
      const a = countDir(r, c, dr, dc, color);
      const b = countDir(r, c, -dr, -dc, color);
      if (1 + a + b >= WIN) {
        const line = [{ r, c }];
        let rr = r + dr, cc = c + dc;
        while (rr >= 0 && rr < SIZE && cc >= 0 && cc < SIZE && board[rr][cc] === color) {
          line.push({ r: rr, c: cc }); rr += dr; cc += dc;
        }
        rr = r - dr; cc = c - dc;
        while (rr >= 0 && rr < SIZE && cc >= 0 && cc < SIZE && board[rr][cc] === color) {
          line.push({ r: rr, c: cc }); rr -= dr; cc -= dc;
        }
        return line;
      }
    }
    return null;
  }

  function boardFull() {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (!board[r][c]) return false;
    return true;
  }

  function wouldWin(r, c, color) {
    if (board[r][c]) return false;
    board[r][c] = color;
    const w = !!findWin(r, c, color);
    board[r][c] = "";
    return w;
  }

  function scorePlace(r, c, me) {
    if (board[r][c]) return -1e9;
    const them = opp(me);
    if (wouldWin(r, c, me)) return 1e6;
    if (wouldWin(r, c, them)) return 5e5;

    let score = 0;
    const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
    board[r][c] = me;
    for (const [dr, dc] of dirs) {
      const a = countDir(r, c, dr, dc, me);
      const b = countDir(r, c, -dr, -dc, me);
      const n = 1 + a + b;
      let open = 0;
      let rr = r + dr * (a + 1), cc = c + dc * (a + 1);
      if (rr >= 0 && rr < SIZE && cc >= 0 && cc < SIZE && !board[rr][cc]) open++;
      rr = r - dr * (b + 1); cc = c - dc * (b + 1);
      if (rr >= 0 && rr < SIZE && cc >= 0 && cc < SIZE && !board[rr][cc]) open++;
      if (n >= 4 && open >= 1) score += 8000;
      else if (n === 3 && open === 2) score += 2000;
      else if (n === 3 && open === 1) score += 200;
      else if (n === 2 && open === 2) score += 80;
      else score += n * 5 + open;
    }
    board[r][c] = "";

    board[r][c] = them;
    for (const [dr, dc] of dirs) {
      const a = countDir(r, c, dr, dc, them);
      const b = countDir(r, c, -dr, -dc, them);
      const n = 1 + a + b;
      let open = 0;
      let rr = r + dr * (a + 1), cc = c + dc * (a + 1);
      if (rr >= 0 && rr < SIZE && cc >= 0 && cc < SIZE && !board[rr][cc]) open++;
      rr = r - dr * (b + 1); cc = c - dc * (b + 1);
      if (rr >= 0 && rr < SIZE && cc >= 0 && cc < SIZE && !board[rr][cc]) open++;
      if (n >= 4 && open >= 1) score += 6000;
      else if (n === 3 && open === 2) score += 1500;
      else if (n === 3) score += 150;
    }
    board[r][c] = "";

    const center = 7;
    score += (14 - (Math.abs(r - center) + Math.abs(c - center))) * 2;
    return score;
  }

  function nearStone(r, c) {
    for (let dr = -2; dr <= 2; dr++)
      for (let dc = -2; dc <= 2; dc++) {
        if (!dr && !dc) continue;
        const rr = r + dr, cc = c + dc;
        if (rr >= 0 && rr < SIZE && cc >= 0 && cc < SIZE && board[rr][cc]) return true;
      }
    return false;
  }

  function aiMove() {
    let best = null;
    let bestScore = -1e12;
    let any = false;
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (board[r][c]) any = true;

    if (!any) return { r: 7, c: 7 };

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (board[r][c]) continue;
        if (any && !nearStone(r, c)) continue;
        const s = scorePlace(r, c, "w");
        if (s > bestScore) {
          bestScore = s;
          best = { r, c };
        }
      }
    }
    if (!best) {
      for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++)
          if (!board[r][c]) return { r, c };
    }
    return best;
  }

  function place(r, c) {
    if (result !== "play") return;
    if (board[r][c]) return;
    board[r][c] = turn;
    history.push({ r, c });
    const line = findWin(r, c, turn);
    if (line) {
      result = turn;
      winLine = line;
      turn = opp(turn);
      sync();
      return;
    }
    if (boardFull()) {
      result = "draw";
      sync();
      return;
    }
    turn = opp(turn);
    sync();

    if (mode === "ai" && result === "play" && turn === "w") {
      const m = aiMove();
      if (m) setTimeout(() => place(m.r, m.c), 60);
    }
  }

  function undo() {
    if (!history.length) return;
    const last = history[history.length - 1];
    const lastColor = board[last.r][last.c];
    const popOne = () => {
      const p = history.pop();
      if (p) board[p.r][p.c] = "";
    };
    popOne();
    if (mode === "ai" && lastColor === "w" && history.length) popOne();
    result = "play";
    winLine = null;
    turn = history.length % 2 === 0 ? "b" : "w";
    sync();
  }

  function reset() {
    board = emptyBoard();
    turn = "b";
    result = "play";
    history = [];
    winLine = null;
    sync();
  }

  function sync() {
    draw();
    const status = document.getElementById("status");
    const moves = document.getElementById("moves");
    const blackTurn = document.getElementById("black-turn");
    const whiteTurn = document.getElementById("white-turn");
    const undoBtns = [document.getElementById("undo"), document.getElementById("undo2")];

    moves.textContent = "第 " + history.length + " 手";
    undoBtns.forEach((b) => { if (b) b.disabled = history.length === 0; });

    document.getElementById("black-role").textContent = mode === "ai" ? "你" : "玩家 1";
    document.getElementById("white-role").textContent = mode === "ai" ? "电脑" : "玩家 2";

    blackTurn.hidden = !(result === "play" && turn === "b");
    whiteTurn.hidden = !(result === "play" && turn === "w");

    status.classList.toggle("win", result === "b" || result === "w");
    if (result === "b") status.textContent = "黑棋胜";
    else if (result === "w") status.textContent = "白棋胜";
    else if (result === "draw") status.textContent = "平局";
    else status.textContent = turn === "b" ? "黑棋落子" : "白棋落子";

    document.getElementById("mode-ai").classList.toggle("active", mode === "ai");
    document.getElementById("mode-pvp").classList.toggle("active", mode === "pvp");
  }

  function canvasPoint(ev) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
      x: (ev.clientX - rect.left) * scaleX,
      y: (ev.clientY - rect.top) * scaleY,
    };
  }

  canvas.addEventListener("click", (ev) => {
    const { x, y } = canvasPoint(ev);
    const cell = cellAt(x, y);
    if (!cell) return;
    if (mode === "ai" && turn === "w") return;
    place(cell.r, cell.c);
  });

  document.getElementById("undo").onclick = undo;
  document.getElementById("undo2").onclick = undo;
  document.getElementById("reset").onclick = reset;
  document.getElementById("reset2").onclick = reset;
  document.getElementById("mode-ai").onclick = () => { mode = "ai"; reset(); };
  document.getElementById("mode-pvp").onclick = () => { mode = "pvp"; reset(); };
  document.getElementById("toggle-panel").onclick = togglePanel;
  document.getElementById("collapse").onclick = () => setPanelOpen(false);
  document.getElementById("scrim").onclick = () => setPanelOpen(false);

  window.addEventListener("keydown", (ev) => {
    const k = ev.key.toLowerCase();
    if (ev.key === "Tab") {
      ev.preventDefault();
      togglePanel();
      return;
    }
    if ((ev.metaKey || ev.ctrlKey) && k === "z") { ev.preventDefault(); undo(); }
    else if ((ev.metaKey || ev.ctrlKey) && k === "n") { ev.preventDefault(); reset(); }
    else if ((ev.metaKey || ev.ctrlKey) && k === "1") { mode = "pvp"; reset(); }
    else if ((ev.metaKey || ev.ctrlKey) && k === "2") { mode = "ai"; reset(); }
    else if (k === "z" && !ev.metaKey && !ev.ctrlKey) undo();
    else if (k === "n" && !ev.metaKey && !ev.ctrlKey) reset();
    else if (k === "[" ) setPanelOpen(false);
    else if (k === "]") setPanelOpen(true);
  });

  window.addEventListener("resize", () => {
    appEl.classList.toggle("scrim-on", appEl.classList.contains("panel-open") && window.innerWidth < 900);
    resizeCanvas();
    draw();
  });

  // restore panel preference — default open once, then remember
  const saved = localStorage.getItem("goban.panelOpen");
  if (saved === "0") setPanelOpen(false);
  else setPanelOpen(true);

  resizeCanvas();
  sync();
})();
  </script>
</body>
</html>
